      - "Add 2 × Tart with cherry (1,000 AMD each) to the cart"
      - "Go to checkout and choose Delivery"
      - "Type SAVE10 in the promo code field and press Apply"
    expected: "The page shows \"Add 1,000 AMD more to use this code\"; no discount is applied and the total stays 2,500 AMD (2,000 + 500 delivery)"
    expected_source: Q-3
    status: automated
    spec: "KAN-10-TC-01: SAVE10 with a 2,000 AMD subtotal is refused with the missing amount"
