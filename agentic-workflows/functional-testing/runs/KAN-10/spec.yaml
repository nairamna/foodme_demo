ticket: KAN-10
sut: https://foodme-nairamnatsakanyan.onrender.com/
sources:
  doc: agentic-workflows/functional-testing/runs/KAN-10/sources/KAN-10.md   # word-for-word copy of the KAN-10 description
  jira: [KAN-10]
acs:
  - id: AC-1
    text: "On the checkout page, the customer can enter a promo code and press Apply."
    source: KAN-10
  - id: AC-2
    text: "A valid code reduces the subtotal by the code's percentage. The discount and the new total are shown before the order is placed."
    source: KAN-10
  - id: AC-3
    text: "A code works only if the subtotal is at least the code's minimum order amount. Otherwise the page shows \"Add {missing amount} AMD more to use this code\"."
    source: KAN-10
  - id: AC-4
    text: "An expired code shows \"This code has expired\"."
    source: KAN-10
  - id: AC-5
    text: "An unknown code shows \"Code not found\"."
    source: KAN-10
  - id: AC-6
    text: "One code per order. Applying a second code replaces the first."
    source: KAN-10
  - id: AC-7
    text: "The customer can remove the applied code, and the total goes back to the original."
    source: KAN-10
launch_codes:   # from the ticket's "Launch codes" table, word for word
  - { code: SAVE10, discount: "10%", minimum_order: "3,000 AMD", status: valid }
  - { code: TREAT15, discount: "15%", minimum_order: "8,000 AMD", status: valid }
  - { code: OLD15, discount: "15%", minimum_order: none, status: expired }
out_of_scope:
  - "Free-delivery codes"
  - "Chef-specific codes"
  - "First-order-only codes"
questions:
  - id: Q-1
    about: [AC-2, AC-7]
    text: "AC-2 says \"A valid code reduces the subtotal by the code's percentage\" but also \"The discount and the new total are shown\". The total includes the delivery fee. Is the percentage taken from the subtotal only, or from the subtotal plus delivery?"
    options:
      - "From the subtotal only; delivery is added in full after the discount"
      - "From the subtotal plus delivery (the whole total)"
    answer: "From the subtotal plus delivery (the whole total)"
    answered_by: "Admin"
  - id: Q-2
    about: [AC-2]
    text: "AC-2 says the code \"reduces the subtotal by the code's percentage\", but the ticket gives no rounding rule. 15% of 8,050 AMD is 1,207.5 AMD. How is a fractional discount shown and charged?"
    options:
      - "Rounded to the nearest whole AMD (1,207.5 → 1,208)"
      - "Rounded down to a whole AMD (1,207.5 → 1,207)"
      - "Kept with decimals (1,207.5)"
    answer: "Rounded down to a whole AMD (1,207.5 → 1,207)"
    answered_by: "Admin"
  - id: Q-3
    about: [AC-3]
    text: "AC-3 says \"Add {missing amount} AMD more to use this code\", and the launch table writes amounts as \"3,000 AMD\". How is {missing amount} formatted, e.g. for 1,200 AMD missing?"
    options:
      - "With a thousands comma: \"Add 1,200 AMD more to use this code\""
      - "Plain digits: \"Add 1200 AMD more to use this code\""
    answer: "With a thousands comma: \"Add 1,200 AMD more to use this code\""
    answered_by: "Admin"
  - id: Q-4
    about: [AC-6]
    text: "AC-6 says \"Applying a second code replaces the first\". What happens when the second code is not valid (unknown, expired or below its minimum) while a valid code is applied?"
    options:
      - "The first code stays applied, and the error for the second code is shown"
      - "The first code is removed, and the error for the second code is shown"
    answer: "The first code stays applied, and the error for the second code is shown"
    answered_by: "Admin"
  - id: Q-5
    about: [AC-2, AC-3]
    text: "AC-3 says \"A code works only if the subtotal is at least the code's minimum order amount\", but no AC says what happens to an applied code when the cart changes afterwards, e.g. the subtotal drops below the minimum or the delivery method changes. What should the page do?"
    options:
      - "Re-check the code: below the minimum it stops applying and shows the AC-3 message; otherwise the discount is recalculated"
      - "Keep the discount as it was applied"
      - "Out of scope for this test run"
    answer: "Re-check the code: below the minimum it stops applying and shows the AC-3 message; otherwise the discount is recalculated"
    answered_by: "Admin"
  - id: Q-6
    about: [AC-1, AC-5]
    text: "The launch codes are written in capitals (\"SAVE10\"). AC-5 says \"An unknown code shows \"Code not found\"\". Is \"save10\" (lower case) or \" SAVE10 \" (with spaces) the same code, or an unknown one?"
    options:
      - "Case and surrounding spaces are ignored: \"save10\" works like SAVE10"
      - "Codes must match exactly: \"save10\" shows \"Code not found\""
    answer: "Codes must match exactly: \"save10\" shows \"Code not found\""
    answered_by: "Admin"
  - id: Q-7
    about: [AC-2]
    text: "AC-2 says \"The discount and the new total are shown before the order is placed\", but doesn't say what the placed order records. Should a test check that the placed order is charged the discounted total?"
    options:
      - "Yes: the placed order's total equals the discounted total shown at checkout"
      - "No: only the checkout page before placing the order is in scope"
    answer: "Yes: the placed order's total equals the discounted total shown at checkout"
    answered_by: "Admin"
  - id: Q-8
    about: [AC-1]
    text: "AC-1 says \"the customer can enter a promo code and press Apply\". Must the customer be signed in to apply a code, or can a guest at checkout apply one too?"
    options:
      - "Only signed-in customers can apply a code"
      - "Guests and signed-in customers can both apply a code"
    answer: "Only signed-in customers can apply a code"
    answered_by: "Admin"
